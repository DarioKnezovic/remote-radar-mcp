services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: remote_radar
      POSTGRES_PASSWORD: remote_radar
      POSTGRES_DB: remote_radar
    ports:
      # 5433 on the host, so it doesn't clash with a locally installed Postgres.
      - '5433:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remote_radar -d remote_radar']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
