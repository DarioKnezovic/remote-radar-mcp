name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 = minimum supported (engines), 24 = active LTS
        node: [22, 24]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: remote_radar
          POSTGRES_PASSWORD: remote_radar
          POSTGRES_DB: remote_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remote_radar -d remote_radar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Enables the Postgres integration tests (they skip when this is unset).
      TEST_DATABASE_URL: postgres://remote_radar:remote_radar@localhost:5432/remote_radar
      DATABASE_URL: postgres://remote_radar:remote_radar@localhost:5432/remote_radar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit + integration tests with coverage
        run: npm run test:coverage
      - name: Smoke test the built server over stdio
        # Starts the real binary (migrations + stdio transport) and checks the MCP handshake.
        run: |
          npm run build
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          # Keep stdin open briefly so the response is written before the server sees EOF and exits.
          response=$( (echo "$request"; sleep 2) | timeout 30 node dist/index.js)
          echo "$response"
          echo "$response" | grep -q '"serverInfo":{"name":"remote-radar"'
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
